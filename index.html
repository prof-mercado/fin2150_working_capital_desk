<style>
:root {
  --forest: #154734; --cyprus: #003B49; --orient: #005F83; --lima: #72BF44;
  --mist: #B1E4E3; --pebble: #D6D1CA; --shuttle: #63666A; --bg: #F7F7F5; --text: #333333;
  --mist-tint: #E4F4F3; --forest-tint: #EAF3EE; --white: #FFFFFF;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: Arial, "Helvetica Neue", Helvetica, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 17px; line-height: 1.5; overflow-wrap: break-word;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
h1, h2, h3 { line-height: 1.25; color: var(--forest); }
h2 { font-size: 1.35rem; margin: 20px 0 12px; }
h2:focus { outline: none; }
h3 { font-size: 1.1rem; margin: 18px 0 8px; }
p { margin: 0 0 10px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 3px solid var(--orient); outline-offset: 2px; }

/* Top bar */
.topbar { background: var(--forest); color: var(--white); }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 56px; padding-top: 6px; padding-bottom: 6px; }
.brand { font-weight: 700; font-size: 1.05rem; margin: 0; color: var(--white); }
.brand small { display: block; font-weight: 400; font-size: 0.95rem; opacity: 0.95; }
.topbar :focus-visible { outline-color: var(--white); }
.top-actions { display: flex; align-items: center; gap: 8px; }
.idtag { font-size: 1rem; white-space: nowrap; }
@media (max-width: 479px) { .brand small { display: none; } .brand { font-size: 1rem; } }
.btn-ghost { min-height: 44px; min-width: 44px; padding: 8px 14px; border-radius: 8px; border: 2px solid var(--white); background: transparent; color: var(--white); font: inherit; font-size: 1rem; font-weight: 700; cursor: pointer; }
.btn-ghost.confirm { background: var(--white); color: var(--forest); }
.progress { background: #DCE7E1; height: 8px; }
.progress .bar { background: var(--lima); height: 8px; width: 0; transition: width .3s; }
.stage { color: var(--shuttle); font-size: 1rem; margin: 14px 0 0; font-weight: 700; letter-spacing: .02em; }

/* Voices */
.card { border-radius: 12px; padding: 14px 16px; margin: 12px 0; }
.mentor { background: var(--mist-tint); border: 1px solid var(--mist); border-left: 6px solid var(--forest); }
.who { font-weight: 700; font-size: 1rem; margin: 0 0 6px; color: var(--forest); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mentor .who::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--forest); display: inline-block; }
.counterpart { background: var(--white); border: 1px solid var(--pebble); box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.nametag { display: inline-block; background: var(--cyprus); color: var(--white); border-radius: 999px; padding: 3px 12px; font-weight: 700; font-size: 1rem; }
.role { color: var(--shuttle); font-weight: 400; font-size: 1rem; }
.speech { margin: 0; }
.event { background: var(--white); border: 2px dashed var(--orient); }
.event h3 { margin-top: 0; color: var(--orient); }
.banner { background: var(--forest); color: var(--white); text-align: center; font-weight: 700; letter-spacing: .1em; padding: 14px 12px; border-radius: 12px; margin: 16px 0; font-size: 1.1rem; }
.banner.end { background: var(--cyprus); }
.scene { font-size: 1.05rem; }

/* Data cards */
.data { background: var(--white); border: 1px solid var(--pebble); border-top: 6px solid var(--orient); }
.data h3 { margin-top: 0; color: var(--cyprus); }
.rows { margin: 0; }
.rows > div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 0; border-bottom: 1px solid #ECEAE6; }
.rows > div:last-child { border-bottom: 0; }
.rows dt { color: var(--shuttle); flex: 1 1 55%; }
.rows dd { margin: 0; font-weight: 700; text-align: right; flex: 1 1 45%; overflow-wrap: anywhere; }
.rows.stack > div { display: block; }
.rows.stack dd { text-align: left; font-weight: 400; }
.rows.stack dt { font-weight: 700; color: var(--cyprus); font-size: 1rem; }
.note { color: var(--shuttle); font-size: 1rem; }
.cite { color: var(--shuttle); font-size: 0.8rem; font-style: italic; display: block; margin-top: 2px; }

/* Formula card + Desk File */
details { border-radius: 12px; margin: 12px 0; background: var(--white); border: 1px solid var(--pebble); }
details > summary { cursor: pointer; min-height: 48px; padding: 12px 16px; font-weight: 700; color: var(--forest); list-style-position: inside; }
details > .inner { padding: 0 16px 12px; }
.formula { border-left: 6px solid var(--lima); }
.formula li { margin: 4px 0; }
.mono { font-family: "Courier New", Courier, monospace; }
.example { background: var(--forest-tint); border-radius: 8px; padding: 8px 10px; }
.deskfile ul { margin: 0; padding-left: 20px; }
.deskfile li { margin: 4px 0; }
.deskfile h4 { margin: 10px 0 2px; color: var(--cyprus); font-size: 1rem; }
@media (min-width: 1180px) {
  .deskfile { position: fixed; top: 76px; right: 16px; width: calc((100vw - 720px) / 2 - 32px); max-height: calc(100vh - 96px); overflow: auto; margin: 0; z-index: 4; }
}

/* Forms */
form { margin: 0; }
fieldset { border: 0; padding: 0; margin: 16px 0; min-width: 0; }
legend { font-weight: 700; color: var(--forest); font-size: 1.1rem; padding: 0; margin-bottom: 8px; }
.field { margin: 0 0 14px; }
.field label { display: block; font-weight: 700; margin-bottom: 6px; }
.inrow { display: flex; align-items: stretch; border: 2px solid var(--shuttle); border-radius: 10px; background: var(--white); overflow: hidden; }
.inrow:focus-within { outline: 3px solid var(--orient); outline-offset: 2px; }
.inrow .unit { display: flex; align-items: center; padding: 0 12px; background: #EFEDEA; color: var(--text); font-weight: 700; min-width: 44px; justify-content: center; }
.inrow input { flex: 1; min-width: 0; border: 0; min-height: 48px; padding: 8px 12px; font: inherit; font-size: 1.1rem; color: var(--text); background: transparent; }
.inrow input:focus { outline: none; }
.inrow input:disabled { background: #F2F1EE; color: var(--text); }
.hint { color: var(--shuttle); font-size: 1rem; margin: 4px 0 0; }
.err { color: #A3261B; font-size: 1rem; margin: 4px 0 0; font-weight: 700; }
textarea { width: 100%; min-height: 120px; border: 2px solid var(--shuttle); border-radius: 10px; padding: 10px 12px; font: inherit; color: var(--text); background: var(--white); }
textarea:focus { outline: 3px solid var(--orient); outline-offset: 2px; }
input[type=text].plain { width: 100%; border: 2px solid var(--shuttle); border-radius: 10px; min-height: 48px; padding: 8px 12px; font: inherit; font-size: 1.1rem; }
input[type=text].plain:focus { outline: 3px solid var(--orient); outline-offset: 2px; }

.opts { display: grid; gap: 8px; }
.opt { position: relative; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 10px 14px; border: 2px solid var(--pebble); border-radius: 10px; background: var(--white); cursor: pointer; }
.opt input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.opt .dot { flex: 0 0 22px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--shuttle); background: var(--white); position: relative; }
.opt .lbl { flex: 1; }
.opt .sub { display: block; color: var(--shuttle); font-size: 1rem; }
.opt.checked { border-color: var(--forest); background: var(--forest-tint); }
.opt.checked .dot { border-color: var(--forest); }
.opt.checked .dot::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--forest); }
.opt.focus { outline: 3px solid var(--orient); outline-offset: 2px; }
.opt.disabled { cursor: default; opacity: .85; }
.opt.disabled input { cursor: default; }
.optgrid { display: grid; gap: 4px 12px; grid-template-columns: 1fr 1fr; margin-top: 6px; font-size: 1rem; }
.optgrid span { color: var(--shuttle); }
.optgrid b { color: var(--text); }

.applicant { background: var(--white); border: 1px solid var(--pebble); border-radius: 12px; padding: 14px 16px; margin: 14px 0; }
.applicant h3 { margin-top: 0; color: var(--cyprus); }

/* Action bar */
.actionbar { position: sticky; bottom: 0; z-index: 5; background: rgba(247,247,245,.97); border-top: 1px solid var(--pebble); padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); margin-top: 16px; }
.actionbar .wrap { display: flex; gap: 8px; align-items: center; }
.btn { min-height: 48px; padding: 10px 20px; border-radius: 10px; border: 0; background: var(--forest); color: var(--white); font: inherit; font-weight: 700; font-size: 1.05rem; cursor: pointer; width: 100%; }
.btn:hover:not(:disabled) { background: #0F3527; }
.btn.secondary:hover:not(:disabled) { background: var(--forest-tint); color: var(--forest); }
.btn:disabled { background: var(--pebble); color: #4A4A4A; cursor: not-allowed; }
.btn.secondary { background: var(--white); color: var(--forest); border: 2px solid var(--forest); }
.need { color: var(--shuttle); font-size: 1rem; margin: 0; flex: 1; display: none; }
@media (min-width: 760px) {
  .actionbar { position: static; background: transparent; border-top: 0; }
  .btn { width: auto; min-width: 220px; }
  .need { display: block; }
}

/* Feedback */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 12px 0; }
.tile { background: var(--white); border: 1px solid var(--pebble); border-top: 6px solid var(--lima); border-radius: 12px; padding: 10px 6px; text-align: center; }
.tile .big { font-size: clamp(1.5rem, 7vw, 2rem); font-weight: 700; color: var(--forest); display: block; }
.tile .lab { font-size: 1rem; color: var(--text); }
.list { list-style: none; margin: 0; padding: 0; }
.list li { background: var(--white); border: 1px solid var(--pebble); border-radius: 10px; padding: 10px 12px; margin: 8px 0; }
.list .k { font-weight: 700; display: block; }
.ok { color: var(--forest); font-weight: 700; }
.no { color: #A3261B; font-weight: 700; }
.realworld { background: var(--white); border: 1px solid var(--pebble); border-left: 6px solid var(--cyprus); }
.realworld h3 { margin-top: 0; color: var(--cyprus); }
.realworld ul { margin: 0; padding-left: 20px; }
.realworld li { margin: 8px 0; }
.codebox { background: var(--white); border: 3px solid var(--forest); border-radius: 12px; padding: 16px; text-align: center; margin: 14px 0; }
.codebox .code { font-family: "Courier New", Courier, monospace; font-size: 1.6rem; font-weight: 700; color: var(--forest); letter-spacing: .04em; overflow-wrap: anywhere; }
.copyout { width: 100%; min-height: 220px; font-family: "Courier New", Courier, monospace; font-size: 1rem; }
.scen-name { font-weight: 700; }
.mute { color: var(--shuttle); }

@media (prefers-reduced-motion: no-preference) {
  .screen { animation: fadein .25s ease-out; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

/* Results card (built to be screenshotted) */
.receipt { background: var(--white); border: 3px solid var(--forest); }
.receipt-title { font-weight: 700; color: var(--forest); margin: 0 0 4px; }
.receipt h3 { margin: 14px 0 4px; color: var(--cyprus); }
.receipt .codebox { border-width: 2px; margin: 10px 0; padding: 10px; }
.receipt .rows > div { padding: 5px 0; }
.reflection-text { white-space: pre-wrap; background: var(--forest-tint); border-radius: 8px; padding: 8px 10px; margin: 0; }
.plaintext .btn { margin-top: 8px; }
body.results-mode .actionbar { position: static; }
</style>

<script>
/* ===== WCD-CORE-BEGIN =====
   Shared engine for the Working Capital Desk.
   This block is copied IDENTICALLY into index.html and verify.html by tools/build.js.
   A unit test fails if the two copies ever differ. Edit src/core.js, then rebuild. */

/* ---------------- CONFIG (edit here, then rebuild both files) ---------------- */
var CONFIG = {
  TAX_RATE: 0.21,            // Tax rate used in Turn 4 (21% = U.S. federal corporate rate). Textbook examples use 40%.
  SALT: 'FIN2150-F26-WCDESK-k7Q2', // Checksum salt for completion codes. Change each term; both files must match.
  TOL_REL: 0.005,            // Relative tolerance on numeric answers (0.5%)
  TOL_ABS_MONEY: 1,          // Absolute tolerance on dollar answers ($1); the larger of the two tolerances applies
  TOL_ABS_PCT: 0.0005,       // Absolute floor on percentage answers (0.05 percentage points)
  TOL_ABS_UNITS: 1,          // Absolute tolerance on unit answers such as average inventory (1 unit)
  TOL_EOQ: 1,                // EOQ must be within +/- 1 unit
  TOL_ORDERS: 0.05,          // Orders per year must be within +/- 0.05
  DAYS_IN_YEAR: 360,         // Textbook convention: 360-day year everywhere
  COURSE: 'FIN 2150 Corporate Finance I',
  INSTITUTION: 'Missouri University of Science and Technology',
  TEXTBOOK: 'Block, Hirt, Danielsen, & Warr (2025), Foundations of Financial Management, Chapter 7',
  EXAM_LABEL: 'Exam II (Friday, October 30; Chapters 5 to 8)',
  PROJECT_LABEL: 'Project Part 2 (DSO and inventory, due November 1)',
  COURSE_YEAR: 2026,         // Year used to turn a code's day-of-year back into a date
  STORAGE_PREFIX: 'wcdesk:v2:', // localStorage namespace (change to wipe all saved progress)
  MAX_ATTEMPT: 9             // Attempt counter caps at 9 (one digit in the code)
};

var WCD = (function () {
  'use strict';

  /* ---------- Hash + seeded PRNG (all case data comes from here; no unseeded randomness) ---------- */
  function cyrb53(str, seed) {
    seed = seed || 0;
    var h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (var i = 0; i < str.length; i++) {
      var ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507);
    h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507);
    h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return 4294967296 * (2097151 & h2) + (h1 >>> 0);
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function rnd(x, dp) { var f = Math.pow(10, dp); return Math.round(x * f) / f; }
  function makeRng(seedNum) {
    var f = mulberry32(seedNum);
    var r = {
      next: f,
      int: function (a, b) { return a + Math.floor(f() * (b - a + 1)); },
      pick: function (arr) { return arr[Math.floor(f() * arr.length)]; },
      step: function (min, max, step) { var n = Math.round((max - min) / step); return rnd(min + r.int(0, n) * step, 6); },
      shuffle: function (arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(f() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
    };
    return r;
  }
  function roundTo(x, unit) { return Math.round(x / unit) * unit; }

  /* ---------- Student name (seeds the numbers; no student ID is collected) ----------
     Case, accents, extra spaces and punctuation are ignored, so "Jose  GARCIA" and
     "jose garcia" (with or without accents) get the same case. A different spelling or a nickname gets different numbers. */
  function normalizeName(raw) {
    if (raw === null || raw === undefined) return null;
    var s = String(raw);
    if (s.normalize) s = s.normalize('NFKD').replace(/[\u0300-\u036f]/g, '');
    s = s.toLowerCase().replace(/['\u2019]/g, '').replace(/[^\p{L}]+/gu, ' ').trim();
    var letters = (s.match(/\p{L}/gu) || []).length;
    if (letters < 2 || s.length > 80) return null;
    return s;
  }
  function displayName(raw) { return String(raw || '').replace(/\s+/g, ' ').trim().slice(0, 60); }
  // 4-digit name fingerprint stored in the completion code (verify.html recomputes it from the name)
  function nameTag(raw) { var n = normalizeName(raw); return n === null ? null : ('000' + (cyrb53(n, 4242) % 10000)).slice(-4); }

  /* ---------- Numbers students have already seen (never reproduced) ----------
     Chapter 7 end-of-chapter problems (Block et al., 2025, solutions manual), the chapter's worked
     examples, and the Session 8.1/8.2 class examples and exit tickets. The generator rejects any
     case that matches these, so the desk never repeats a homework or class problem. */
  var AVOID = {
    t1Pairs: [[5000000, 2.0], [2500000, 3.0], [2000000, 2.5], [1000000, 3.0]],  // daily collections, days saved (P7-1, P7-2, chapter/8.1 Trailhead example, 8.1 exit ticket)
    t1Fees: [425000, 90000],                                                   // P7-2 system cost, 8.1 exit-ticket fee
    t1Freed: [13000000, 10000000, 8050000, 7500000, 5000000, 3000000],         // freed-up cash answers students already computed
    t1Earnings: [1560000, 483000, 200000, 120000],                            // annual-earnings answers students already computed
    t4Answers: { roi: [0.288, 0.3705, 0.352, 0.1848, 0.1056, 0.0739, 0.1386, 0.1173, 0.0728], investment: [1667, 50000, 16250, 45000, 112500, 60000, 225000] },
    t5Costs: [80, 560, 1120],                                                 // total-cost answers (chapter example, P7-13, P7-14)
    avgInventory: [250, 290, 300, 350, 370, 175],                             // average-inventory answers (chapter, P7-12 to P7-15)
    t4Sales: [10000, 65000, 150000, 180000, 450000],                          // chapter example, P7-17, P7-18, P7-19/20, P7-21
    t4Costs: [[0.10, 0.05, 0.77], [0.05, 0.02, 0.74], [0.09, 0.06, 0.74], [0.12, 0.09, 0.72]], // bad debts, collection, production
    t5Sets: [[2000, 8, 0.20], [2000, 16, 0.20], [2000, 8, 0.40], [6000, 8, 0.20], [84000, 3, 1.40], [49000, 8, 1.60], [49000, 2, 1.60], [84100, 10, 5.00]],
    eoqAnswers: [283, 350, 400, 566, 580, 600, 693, 700, 2000, 2449],           // EOQs students computed in class or homework
    safetyStock: [50, 80]                                                     // chapter/8.2 example, P7-15
  };
  function near(a, b) { return Math.abs(a - b) < 1e-9; }
  function inList(list, v, tol) { return list.some(function (x) { return Math.abs(x - v) <= tol; }); }
  // A case is rejected if its inputs OR its answers match something students have already seen.
  function avoidT1(D, d, fee, freed, earn) {
    return AVOID.t1Pairs.some(function (x) { return near(x[0], D) && near(x[1], d); }) || AVOID.t1Fees.indexOf(fee) >= 0 ||
      inList(AVOID.t1Freed, freed, 0.5) || inList(AVOID.t1Earnings, earn, 0.5);
  }
  function avoidT4(S, b, c, p, cr) {
    return AVOID.t4Sales.indexOf(S) >= 0 || AVOID.t4Costs.some(function (x) { return near(x[0], b) && near(x[1], c) && near(x[2], p); }) ||
      (cr && (inList(AVOID.t4Answers.roi, cr.roi, 0.0005) || inList(AVOID.t4Answers.investment, cr.investment, 1)));
  }
  function avoidT5(S, O, C, Q, tc) {
    return AVOID.t5Sets.some(function (x) { return near(x[0], S) && near(x[1], O) && near(x[2], C); }) || AVOID.eoqAnswers.indexOf(Q) >= 0 ||
      inList(AVOID.t5Costs, tc, 1) || inList(AVOID.avgInventory, Q / 2, 0.5);
  }
  function avoidT6(A, B, Q) {
    return AVOID.safetyStock.indexOf(A) >= 0 || AVOID.safetyStock.indexOf(B) >= 0 ||
      inList(AVOID.avgInventory, Q / 2 + A, 0.5) || inList(AVOID.avgInventory, Q / 2 + B, 0.5);
  }

  /* ---------- Textbook formulas (pure) ---------- */
  var F = {
    lockbox: function (D, d, r) { return { freed: D * d, earnings: D * d * r }; },
    interest: function (X, rate, days, yearDays) { return X * rate * days / (yearDays || CONFIG.DAYS_IN_YEAR); },
    credit: function (o) {
      var pbt = o.S * (1 - o.b - o.c - o.p);
      var profit = pbt * (1 - o.t);
      var investment = o.S / o.k;
      return { profitBeforeTax: pbt, profit: profit, investment: investment, roi: profit / investment };
    },
    eoq: function (S, O, C) { return Math.sqrt(2 * S * O / C); },
    invCost: function (S, O, C, Q) { var ord = S / Q * O, car = Q / 2 * C; return { ordering: ord, carrying: car, total: ord + car }; },
    avgInventory: function (Q, ss) { return Q / 2 + (ss || 0); },
    carryingCost: function (units, C) { return units * C; },
    collectionPeriod: function (receivables, annualSales) { return receivables / (annualSales / CONFIG.DAYS_IN_YEAR); }
  };

  /* ---------- Scenario metadata (shared so verify.html can label things) ---------- */
  var SCENARIOS = {

  /* ---------- Case generator ---------- */
  function generateCase(studentName, scenario) {
    var key = normalizeName(studentName);
    if (!key) throw new Error('Invalid student name');
    var sc = String(scenario || '').toUpperCase();
    if (!SCENARIOS[sc]) throw new Error('Invalid scenario');
    var rng = makeRng(cyrb53(key + '|' + sc) % 4294967296);
    var Y = CONFIG.DAYS_IN_YEAR;
    var c = { nameKey: key, tag: nameTag(key), scenario: sc, scenarioName: SCENARIOS[sc].name, taxRate: CONFIG.TAX_RATE };

    /* T1 lockbox */
    var acceptTarget = rng.next() < 0.5, D, d, r, remaining, lb, m, fee;
    do {
      D = rng.step(1000000, 5000000, 250000); d = rng.step(1.0, 3.0, 0.5); r = rng.step(0.035, 0.045, 0.0025);
      remaining = rng.step(1.0, 3.0, 0.5);
      lb = F.lockbox(D, d, r);
      m = acceptTarget ? rng.step(0.55, 0.85, 0.01) : rng.step(1.15, 1.45, 0.01);
      fee = Math.round(lb.earnings * m / 1000) * 1000;
    } while (avoidT1(D, d, fee, lb.freed, lb.earnings));
    c.t1 = { D: D, d: d, r: r, totalFloat: rnd(d + remaining, 2), afterFloat: remaining, fee: fee, m: m,
      freed: lb.freed, earnings: lb.earnings, accept: lb.earnings > fee };

    var X = rng.step(500000, 3000000, 100000), base = rng.step(0.039, 0.044, 0.0005);
    var event = rng.next() < 0.5 ? 'rates' : 'downgrade';
    var y = { mmf: rnd(base - 0.0035, 6), t3: base, t6: rnd(base + 0.0015, 6), cp: rnd(base + 0.006, 6) };
    var int = {}; Object.keys(y).forEach(function (k) { int[k] = F.interest(X, y[k], 90, Y); });
    var RATE_LOSS = 0.003, DOWNGRADE_LOSS = 0.02;  // share of X lost if the bad event hits that option

      rateLoss: RATE_LOSS * X, downgradeLoss: DOWNGRADE_LOSS * X, realized: realized, expected: expected,

    var t = CONFIG.TAX_RATE, extendTarget = rng.next() < 0.5, t4 = null;

        p = rng.step(0.65, 0.78, 0.01), k = rng.pick([3, 4, 5, 6]), R = rng.step(0.12, 0.25, 0.01);

      var A = Math.max(10, roundTo(Q * rng.step(0.15, 0.50, 0.05), 10));
      var B = roundTo(Q * rng.step(0.60, 1.50, 0.05), 10);
      if (B < A + 20) continue;
      if (avoidT6(A, B, Q)) continue;

      var order = [0, 1, 2].sort(function (i, j) { return costs[i] - costs[j]; });
      if (costs[order[1]] < costs[order[0]] * 1.10) continue;

        addCarry: { none: 0, a: A * C, b: B * C }, best: keys[order[0]], second: keys[order[1]] };

  }

  /* ---------- Answer parsing and checking ---------- */
  function parseNumber(s) {
    if (s === null || s === undefined) return null;
    var str = String(s).trim();
    if (!str) return null;
    var hadPct = /%/.test(str);
    var neg = /^\(.*\)$/.test(str);
    var clean = str.replace(/[$,%\s()]/g, '').replace(/^\+/, '');
    if (!/^-?(\d+\.?\d*|\.\d+)$/.test(clean)) return null;
    var v = parseFloat(clean);
    if (!isFinite(v)) return null;
    return { value: neg ? -v : v, hadPct: hadPct };
  }
  function within(v, ans, absTol) {
    return Math.abs(v - ans) <= Math.max(CONFIG.TOL_REL * Math.abs(ans), absTol) + 1e-9;
  }
  // kind: money | pct | units | eoq | orders
  function candidates(parsed, kind) {
    if (kind === 'pct') return parsed.hadPct ? [parsed.value / 100] : [parsed.value, parsed.value / 100];
    return [parsed.value];
  }
  function isClose(input, ans, kind) {
    var parsed = typeof input === 'object' && input !== null ? input : parseNumber(input);
    if (!parsed) return false;
    var vals = candidates(parsed, kind);
    for (var i = 0; i < vals.length; i++) {
      var v = vals[i];
      if (kind === 'money' && within(v, ans, CONFIG.TOL_ABS_MONEY)) return true;
      if (kind === 'pct' && within(v, ans, CONFIG.TOL_ABS_PCT)) return true;
      if (kind === 'units' && within(v, ans, CONFIG.TOL_ABS_UNITS)) return true;
      if (kind === 'eoq' && Math.abs(v - ans) <= CONFIG.TOL_EOQ + 1e-9) return true;
      if (kind === 'orders' && Math.abs(v - ans) <= CONFIG.TOL_ORDERS + 1e-9) return true;
    }
    return false;
  }
  function isCloseAny(input, answers, kind) {
    for (var i = 0; i < answers.length; i++) if (isClose(input, answers[i], kind)) return true;
    return false;
  }
  function numVal(input, kind) {
    var p = parseNumber(input); if (!p) return null;
    if (kind === 'pct') return p.hadPct || Math.abs(p.value) > 1.5 ? p.value / 100 : p.value;
    return p.value;
  }

  /* ---------- Formatting ---------- */
  function money(x, dp) {
    if (x === null || x === undefined || !isFinite(x)) return '--';
    dp = dp === undefined ? (Math.abs(x) < 100 && Math.round(x) !== x ? 2 : 0) : dp;
    var neg = x < 0; x = Math.abs(x);
    var s = x.toFixed(dp).split('.');
    s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  }
  function num(x, dp) {
    if (x === null || x === undefined || !isFinite(x)) return '--';

  /* ---------- Grading ---------- */
  var NUMERIC = [
    { turn: 1, key: 'freed', kind: 'money', label: 'Freed-up cash' },
    { turn: 1, key: 'earnings', kind: 'money', label: 'Annual earnings on freed cash' },
    { turn: 2, key: 'interest', kind: 'money', label: '90-day interest on the 3-month T-bill' },
    { turn: 4, key: 'profit', kind: 'money', label: 'Incremental after-tax profit' },

  function numericAnswer(c, item, resp) {
    var R = resp || {};
    switch (item.key) {
      case 'freed': return [c.t1.freed];
      case 'earnings': return [c.t1.earnings];
      case 'interest': return [c.t2.interest];
      case 'profit': return [c.t4.profit];
      case 'investment': return [c.t4.investment];
      case 'roi': return [c.t4.roi];
      case 'eoq': return [c.t5.eoq, c.t5.eoqExact];
      case 'orders': {
        var a = [c.t5.orders, c.t5.ordersExact];
        var se = numVal((R.t5 || {}).eoq, 'units');
        if (se && Math.abs(se - c.t5.eoqExact) <= CONFIG.TOL_EOQ + 0.5) a.push(c.t5.S / se);

  function detectErrors(c, resp) {
    var errs = [], R = resp || {};
    var r1 = R.t1 || {}, r2 = R.t2 || {}, r4 = R.t4 || {}, r5 = R.t5 || {}, r6 = R.t6 || {};
    function add(turn, code, name, detail) { errs.push({ turn: turn, code: code, name: name, detail: detail }); }
    // T1
    if (r1.decision === 'accept' && !c.t1.accept)
      add(1, 'T1_BALANCE_VS_FEE', 'Compared a one-time balance with a yearly fee',
        'The ' + money(c.t1.freed) + ' of freed-up cash is a one-time balance, so it is not comparable to a fee paid every year. Compare the fee with what that cash earns each year: ' + money(c.t1.earnings) + ' vs. ' + money(c.t1.fee) + '.');

    if (r2.decision === 't6')

    // T4

      add(4, 'T4_DIV_SALES', 'Divided by sales instead of the receivables investment',
        'ROI on a credit decision divides profit by the investment in receivables (sales / turnover), not by sales: ' + money(t4.profit) + ' / ' + money(t4.investment) + ' = ' + pct(t4.roi, 1) + '.');

    var noBad = t4.S * (1 - t4.c - t4.p);
    if (isClose(r4.profit, noBad * (1 - t4.t), 'money') || isClose(r4.profit, noBad, 'money'))

    var t2 = c.t2;
    add(s, dataCard('Turn 2: what each option delivered in your run', ['mmf', 't3', 't6', 'cp'].map(function (k) { return [T2OPTS[k].label, M(t2.realized[k])]; }),
      el('p', { class: 'note', text: t2.event === 'rates' ? 'Rates rose, so the 6-month bill sold at a loss. The commercial paper paid this time, but its risk was real.' : 'The issuer was downgraded, so the commercial paper sold below par. The 6-month bill got lucky this time.' })));

    // Focus paragraph + takeaways
    add(s, mentorCard('Your focus: ' + FOCUS[S.focus], focusParagraph(fb)));
    add(s, mentorCard('Three takeaways', [
      el('p', null, el('b', { text: '1. ' }), 'For ' + CONFIG.EXAM_LABEL + ': credit ROI = after-tax profit / (new sales / receivables turnover). Compare it with the required return.'),
      el('p', null, el('b', { text: '2. ' }), 'For Exam II: EOQ = sqrt(2SO/C), average inventory = EOQ/2 + safety stock, and use a 360-day year for interest and float.'),
      el('p', null, el('b', { text: '3. ' }), 'For ' + CONFIG.PROJECT_LABEL + ': compute your company\'s collection period, receivables / (sales / 360), and its inventory turnover, then compare them with the firms below.')]));

    // Full answer check list
    var ul = el('ul', { class: 'list' });
    g.numeric.forEach(function (x) {
      ul.appendChild(el('li', null, el('span', { class: 'k', text: 'Turn ' + x.turn + ': ' + x.label }),
        'Yours: ' + shown(x) + ' | Correct: ' + fmtCorrect(x) + ' | ', el('span', { class: x.ok ? 'ok' : 'no', text: x.ok ? 'Correct' : 'Not quite' })));
    });
    var det = el('details', null, el('summary', { text: 'Full answer check: all 12 numbers' }), el('div', { class: 'inner' }, ul));
    add(s, det);

    // Real world
    add(s, el('section', { class: 'card realworld', 'aria-label': 'In the real world' }, el('h3', { text: 'In the real world' }), el('ul', null,
      el('li', null, 'Apple held $132.4 billion in cash, cash equivalents, and marketable securities at September 27, 2025.', el('span', { class: 'cite', text: 'Source: Apple Inc., FY2025 Form 10-K.' })),
      el('li', null, 'The 3-month T-bill rate was 4.149% at the October 5, 2026 auction, and the Fed raised its target range to 3.75%-4.00% on September 16, 2026.', el('span', { class: 'cite', text: 'Sources: U.S. Department of the Treasury; Federal Reserve.' })),
      el('li', null, 'Collection periods on a 360-day year: Costco about 4 days, Apple about 34, Microsoft about 89.', el('span', { class: 'cite', text: 'Source: FY2025 Form 10-K filings.' })),
      el('li', null, 'Toyota required suppliers to hold two to six months of chips under a business continuity plan created after the 2011 Fukushima disaster.', el('span', { class: 'cite', text: 'Source: Reuters (2021).' })),
      el('li', null, 'Honda halted production at its Celaya, Mexico plant in October 2025 when Nexperia chip supplies stopped.', el('span', { class: 'cite', text: 'Sources: Assembly Magazine; Mexico Business News (October 2025).' })))));
    S.scores = { accuracy: g.accuracy, decisions: g.decisionPct, value: g.valuePct, numericCorrect: g.numericCorrect, decisionPoints: g.decisionPoints, errors: g.errors.map(function (e) { return e.code; }) };
    save();
    refreshPrimary = function () { setPrimary('Continue to reflection', true, function () { go('reflect'); }); };
    refreshPrimary();
  }

  function renderReflect(s) {
    add(s, heading('One last question'));
    add(s, mentorCard('Reflection', 'Which decision would you change, and why? Write 2 to 3 sentences. Thinking it through is what makes the lesson stick, and your answer goes into the results you submit.'));
    var ta = el('textarea', { id: 'reflection', rows: '5', 'aria-describedby': 'ref-hint' });
    ta.value = S.reflection || '';
    var hint = el('p', { class: 'hint', id: 'ref-hint', 'aria-live': 'polite' });
    function upd() { var w = words(ta.value); hint.textContent = w + ' words. Aim for 2 to 3 sentences (at least 12 words).'; }
    ta.addEventListener('input', function () { S.reflection = ta.value.slice(0, 1500); save(); upd(); refreshPrimary(); });
    upd();
    add(s, el('div', { class: 'field' }, el('label', { for: 'reflection', text: 'Which decision would you change, and why?' }), ta, hint));
    refreshPrimary = function () {
      setPrimary('Get my completion code', words(S.reflection || '') >= 12, function () {
        if (!S.scores) { var g = WCD.grade(CASE, S.resp); S.scores = { accuracy: g.accuracy, decisions: g.decisionPct, value: g.valuePct, numericCorrect: g.numericCorrect, decisionPoints: g.decisionPoints }; }
        if (!S.code) {
          S.doy = WCD.dayOfYear(new Date());
          S.code = WCD.encodeCode({ tag: WCD.nameTag(S.name), scenario: S.scen, accuracy: S.scores.accuracy, decisions: S.scores.decisions, value: S.scores.value, attempt: S.attempt, doy: S.doy });
        }
        go('results');
      }, 'Write at least 12 words to continue.');
    };
    refreshPrimary();
  }

  function resultsText() {
    var c = CASE, r = S.resp, sc = S.scores || {};
    var L = [];
    L.push(CONFIG.COURSE + ' | Week 8 Working Capital Desk | Results');
    L.push('Completion code: ' + S.code);
    L.push('Student name: ' + S.name);
    L.push('Scenario: ' + S.scen + '. ' + SC[S.scen].name);
    L.push('Attempt: ' + S.attempt);
    L.push('Support level: ' + S.level + ' | Focus: ' + FOCUS[S.focus]);
    L.push('Accuracy: ' + sc.accuracy + '% (' + sc.numericCorrect + ' of 12 numbers)');
    L.push('Decisions: ' + sc.decisions + '% (' + sc.decisionPoints + ' of 9 points)');
    L.push('Value captured: ' + sc.value + '%');
    L.push('Decisions made:');
    L.push('  T1 Lockbox: ' + DEC_LABEL[1][r.t1.decision]);
    L.push('  T2 Excess cash: ' + DEC_LABEL[2][r.t2.decision]);
    c.t3.applicants.forEach(function (p) { L.push('  T3 ' + p.name + ': ' + labelApp(r.t3.apps[p.id])); });
    L.push('  T3 Biggest concern (' + startupName(c) + '): ' + C_LABEL[r.t3.c]);
    L.push('  T4 Credit standards: ' + DEC_LABEL[4][r.t4.decision]);
    L.push('  T5 Order size: ' + DEC_LABEL[5][r.t5.decision]);
    L.push('  T6 Buffer: ' + DEC_LABEL[6][r.t6.decision]);
    L.push('Reflection: ' + (S.reflection || '').replace(/\s+/g, ' ').trim());
    if ((S.background || '').trim()) L.push('Background note: ' + S.background.replace(/\s+/g, ' ').trim());
    return L.join('\n');
  }

  function renderResults(s) {
    var sc = S.scores || {}, c = CASE, r = S.resp;
    add(s, heading('Your results'));
    add(s, mentorCard('Nice work', 'You finished the desk. Take a screenshot of the results card below, from your name down to your reflection, and upload it to Canvas. Your code is tied to your name, scenario, scores, and attempt, so it only works for you.'));
    // Screenshot-friendly receipt: everything the instructor needs, visible without scrolling inside boxes
    var when = S.doy ? WCD.dateFromDoy(S.doy, CONFIG.COURSE_YEAR) : '';
    var rows = el('dl', { class: 'rows' });
    [['Name', S.name], ['Scenario', S.scen + '. ' + SC[S.scen].name], ['Attempt', String(S.attempt)], ['Completed', when]]
      .forEach(function (x) { rows.appendChild(el('div', null, el('dt', { text: x[0] }), el('dd', { text: x[1] }))); });
    var dec = el('dl', { class: 'rows' });
    var dl = [['T1 Lockbox', DEC_LABEL[1][r.t1.decision]], ['T2 Excess cash', DEC_LABEL[2][r.t2.decision]]];
    c.t3.applicants.forEach(function (p) { dl.push(['T3 ' + p.name, labelApp(r.t3.apps[p.id])]); });
    dl.push(['T3 Biggest concern', C_LABEL[r.t3.c]], ['T4 Credit standards', DEC_LABEL[4][r.t4.decision]], ['T5 Order size', DEC_LABEL[5][r.t5.decision]], ['T6 Buffer', DEC_LABEL[6][r.t6.decision]]);
    dl.forEach(function (x) { dec.appendChild(el('div', null, el('dt', { text: x[0] }), el('dd', { text: x[1] }))); });
    add(s, el('section', { class: 'card receipt', id: 'receipt', 'aria-label': 'Results card' },
      el('p', { class: 'receipt-title', text: CONFIG.COURSE + ' | Working Capital Desk' }),
      rows,
      el('div', { class: 'codebox' }, el('p', { class: 'mute', text: 'Completion code' }), el('p', { class: 'code', id: 'code', text: S.code })),
      el('div', { class: 'tiles' },
        el('div', { class: 'tile' }, el('span', { class: 'big', text: sc.accuracy + '%' }), el('span', { class: 'lab', text: 'Accuracy' })),
        el('div', { class: 'tile' }, el('span', { class: 'big', text: sc.decisions + '%' }), el('span', { class: 'lab', text: 'Decisions' })),
        el('div', { class: 'tile' }, el('span', { class: 'big', text: sc.value + '%' }), el('span', { class: 'lab', text: 'Value captured' }))),
      el('h3', { text: 'My decisions' }), dec,
      el('h3', { text: 'My reflection' }), el('p', { class: 'reflection-text', id: 'reflection-out', text: (S.reflection || '').trim() })));
    add(s, el('p', { class: 'note', text: 'Tip: on an iPhone, take a screenshot, tap the preview, and choose Full Page to save the whole card as a PDF. On Android, use Scroll capture (or Capture more). Two screenshots combined into one PDF also work.' }));
    // Optional plain-text copy
    var txt = resultsText();
    var status = el('p', { class: 'hint', id: 'copy-status', 'aria-live': 'polite' });
    var area = el('textarea', { class: 'copyout', id: 'copytext', readonly: true, 'aria-label': 'Your results as plain text' });
    area.value = txt;
    function fallbackCopy() {
      area.focus(); area.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      status.textContent = ok ? 'Copied.' : 'Select the text above and copy it.';
    }
    function doCopy() {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(txt).then(function () { status.textContent = 'Copied.'; }, fallbackCopy);
        } else fallbackCopy();
      } catch (e) { fallbackCopy(); }
    }
    var copyBtn = el('button', { type: 'button', class: 'btn secondary', id: 'copybtn', text: 'Copy my results as text', onclick: doCopy });
    add(s, el('details', { class: 'plaintext' }, el('summary', { text: 'Optional: copy your results as text' }),
      el('div', { class: 'inner' }, area, copyBtn, status)));
    add(s, el('p', { class: 'note', text: 'Want another try? Use Restart at the top. Your next attempt gets the same numbers for the same scenario, and the code records the attempt number.' }));
    refreshPrimary = function () { setPrimary('Back to the top', true, function () { window.scrollTo(0, 0); var h = document.getElementById('screen-title'); if (h) h.focus(); }); };
    refreshPrimary();
    document.body.classList.add('results-mode');
  }

  /* ---------------- Restart ---------------- */
  var confirmTimer = null;
  function onRestart() {
    if (!restartBtn.classList.contains('confirm')) {
      restartBtn.classList.add('confirm'); restartBtn.textContent = 'Tap again to restart';
      clearTimeout(confirmTimer);
      confirmTimer = setTimeout(function () { restartBtn.classList.remove('confirm'); restartBtn.textContent = 'Restart'; }, 5000);
      return;
    }
    clearTimeout(confirmTimer);
    restartBtn.classList.remove('confirm'); restartBtn.textContent = 'Restart';
    var id = S.id, nm = S.name, next = Math.min(CONFIG.MAX_ATTEMPT, (S.attempt || 1) + 1);
    sdel(stateKey(S));
    sset('attempt:' + id, String(next));
    S = freshState(id, next, nm); CASE = null; save(); render();
  }

  /* ---------------- Boot ---------------- */
  function boot() {
    main = document.getElementById('main'); primary = document.getElementById('primary'); need = document.getElementById('needmsg');
    live = document.getElementById('live'); stage = document.getElementById('stage'); bar = document.getElementById('bar');
    idtag = document.getElementById('idtag'); restartBtn = document.getElementById('restart');
    restartBtn.addEventListener('click', onRestart);
    var last = sjson('last');
    if (last && last.id) {
      var st = loadFor(last.id, last.scen);
      if (st) S = st;
    }
    if (S.step && STEPS.indexOf(S.step) < 0) S = freshState(null, 1);
    try { render(false); } catch (e) { S = freshState(null, 1); CASE = null; render(false); }
  }
  window.WCD_APP = { state: function () { return S; }, caseData: function () { return CASE; }, resultsText: function () { return resultsText(); } };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
</html>
